<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Softmaco</title>
  <meta name="description" content="Get in touch with Softmaco for custom software, AI solutions, and enterprise engineering.">
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    main { padding-top: 120px; padding-bottom: 80px; }
    .contact-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 32px; margin-top: 40px; }
    .info-card { display: flex; flex-direction: column; gap: 24px; }
    .info-item { border-left: 2px solid var(--azure); padding-left: 16px; }
    .info-item.alt { border-left-color: var(--brass); }
    .info-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--muted-2); margin-bottom: 4px; }
    .info-val { font-size: 14.5px; color: var(--text); line-height: 1.5; }
    @media (max-width: 860px) { .contact-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="wrap">
      <div class="section-head reveal">
        <div class="eyebrow">GET IN TOUCH</div>
        <h1 style="font-size:clamp(32px, 4vw, 48px); margin-top:14px;">Let's build together.</h1>
        <p>Tell us about your project, timeline, and goals. We respond within 4 business hours.</p>
      </div>

      <div class="contact-grid">
        <!-- Form -->
        <div class="card reveal" style="padding: 36px;">
          <form onsubmit="handleContact(event)">
            <div class="g2" style="gap:16px;">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-input" placeholder="Sarah Jenkins" required>
              </div>
              <div class="form-group">
                <label class="form-label">Work Email</label>
                <input type="email" class="form-input" placeholder="sarah@company.com" required>
              </div>
            </div>
            <div class="g2" style="gap:16px;">
              <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-input" placeholder="+1 (555) 000-0000">
              </div>
              <div class="form-group">
                <label class="form-label">Services Interested In</label>
                <select class="form-select">
                  <option>Custom Software Development</option>
                  <option>AI / Machine Learning</option>
                  <option>Mobile App Development</option>
                  <option>SaaS Product Engineering</option>
                  <option>Enterprise Licensing / Other</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Project Details</label>
              <textarea class="form-textarea" placeholder="Briefly describe what you're looking to build…" required></textarea>
            </div>
            <button type="submit" class="btn btn-azure btn-lg" style="width:100%; justify-content:center;">Send Message →</button>
          </form>
        </div>

        <!-- Details -->
        <div class="info-card">
          <div class="card reveal">
            <div class="eyebrow" style="margin-bottom: 20px;">DIRECT REACH</div>
            <div style="display:flex; flex-direction:column; gap:14px;">
              <div>
                <div class="info-label">Email</div>
                <a href="mailto:hello@softmaco.com" class="info-val" style="color:var(--azure);" id="c-email">hello@softmaco.com</a>
              </div>
              <div>
                <div class="info-label">Phone</div>
                <div class="info-val" id="c-phone">+1 (415) 820-9900</div>
              </div>
              <div>
                <div class="info-label">Response Time</div>
                <div class="info-val" style="color:var(--emerald);">Under 4 business hours</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/data.js"></script>
  <script src="/js/shared.js"></script>
  <script>
    if (window.SOFTMACO_DATA && SOFTMACO_DATA.company && SOFTMACO_DATA.company.contact) {
      const c = SOFTMACO_DATA.company.contact;
      if (c.email) {
        const el = document.getElementById('c-email');
        el.textContent = c.email;
        el.href = 'mailto:' + c.email;
      }
      if (c.phone) document.getElementById('c-phone').textContent = c.phone;
    }
    function handleContact(e) {
      e.preventDefault();
      const form = e.target;
      const inputs = form.querySelectorAll('input');
      const name = inputs[0] ? inputs[0].value : 'Inquirer';
      const email = inputs[1] ? inputs[1].value : '';
      const phone = inputs[2] ? inputs[2].value : '';
      const service = form.querySelector('select') ? form.querySelector('select').value : 'Custom Software';
      const details = form.querySelector('textarea') ? form.querySelector('textarea').value : '';

      const serviceValues = {
        'Custom Software Development': 45000,
        'AI / Machine Learning': 65000,
        'Mobile App Development': 35000,
        'SaaS Product Engineering': 55000,
        'Enterprise Licensing / Other': 85000
      };

      const newLead = {
        id: 'lead_' + Date.now(),
        name: name,
        email: email,
        phone: phone,
        service: service,
        details: details,
        status: 'New',
        value: serviceValues[service] || 40000,
        assignedTo: 'arjun-mehta',
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      };

      const leads = JSON.parse(localStorage.getItem('softmaco_leads') || '[]');
      leads.unshift(newLead);
      localStorage.setItem('softmaco_leads', JSON.stringify(leads));

      showToast("Message sent! Your lead has been submitted to our team portal.");
      form.reset();
    }
  </script>
</body>
</html>
