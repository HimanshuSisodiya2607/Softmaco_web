<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Product — Softmaco</title>
  <meta id="page-desc" name="description" content="Softmaco product detail">
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    main { padding-top: 100px; }

    /* ── hero ── */
    .prod-hero {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 52px;
      margin-bottom: 48px;
      overflow: hidden;
    }
    .prod-hero::before {
      content: "";
      position: absolute;
      top: -80px; right: -80px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, var(--azure-soft), transparent 70%);
      pointer-events: none;
    }
    .prod-hero-grid { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: flex-start; position: relative; }
    .prod-logo-lg { font-size: 3.5rem; margin-bottom: 14px; }
    .prod-title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
    .prod-meta { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.08em; margin-bottom:16px; }
    .prod-tagline { font-size: 1.2rem; color: var(--text); max-width: 640px; line-height: 1.5; }
    .hero-screenshot { width: 100%; border-radius: var(--radius); border: 1px solid var(--line); margin-top: 32px; }

    /* ── tabs ── */
    .tab-bar { display: flex; gap: 4px; margin-bottom: 40px; border-bottom: 1px solid var(--line); padding-bottom: 0; }
    .tab-btn {
      padding: 12px 20px;
      background: none; border: none;
      font-family:'Inter',sans-serif; font-size:14px; color:var(--muted);
      cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: color .2s, border-color .2s;
    }
    .tab-btn.active { color: var(--azure); border-bottom-color: var(--azure); }
    .tab-btn:hover { color: var(--text); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── feature cards ── */
    .feat-icon { width:38px;height:38px;border-radius:9px;background:var(--azure-soft);display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:16px; }

    /* ── pricing cards ── */
    .price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .price-card { padding: 32px 28px; }
    .price-card.popular { border-color: var(--azure); background: var(--panel-2); }
    .popular-label { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--azure); text-transform:uppercase; margin-bottom:12px; }
    .price-tier { font-size:14px; font-weight:600; margin-bottom:10px; }
    .price-amount { font-family:'Space Grotesk',sans-serif; font-size:2.4rem; font-weight:700; }
    .price-period { font-size:12px; color:var(--muted-2); margin-bottom:22px; }
    .price-feat-list { display:flex; flex-direction:column; gap:10px; margin-bottom:28px; }
    .price-feat-list li { font-size:13.5px; color:var(--muted); display:flex; gap:8px; }
    .price-feat-list .tick { color:var(--azure); flex-shrink:0; }

    /* ── tech section ── */
    .tech-section { padding: 36px; }
    .tech-col-label { font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px; }

    /* ── faq ── */
    .faq-item { border-bottom: 1px solid var(--line); }
    .faq-btn { width:100%; padding:20px 0; background:none; border:none; display:flex; align-items:center; justify-content:space-between; gap:16px; cursor:pointer; text-align:left; }
    .faq-question { font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; color:var(--text); }
    .faq-icon { color:var(--azure); font-size:20px; flex-shrink:0; transition:transform .25s; }
    .faq-answer { display:none; padding:0 0 20px; color:var(--muted); font-size:14.5px; line-height:1.7; }

    /* ── screenshots ── */
    .screenshots-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .screenshot-item { cursor: pointer; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--line); transition: border-color .2s; }
    .screenshot-item:hover { border-color: var(--azure); }
    .screenshot-item img { width:100%; height:220px; object-fit:cover; display:block; }

    /* ── lightbox ── */
    .lightbox { position:fixed; inset:0; background:rgba(7,10,18,.92); z-index:1000; display:none; align-items:center; justify-content:center; padding:32px; }
    .lightbox.open { display:flex; }
    .lightbox img { max-width:1000px; width:100%; border-radius:var(--radius); border:1px solid var(--line-strong); }
    .lb-close { position:absolute; top:24px; right:24px; background:var(--panel); border:1px solid var(--line-strong); color:var(--text); width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

    /* ── related ── */
    .related-card { display:flex; align-items:center; justify-content:space-between; gap:16px; }

    @media(max-width:900px) {
      .prod-hero-grid { grid-template-columns: 1fr; }
      .price-grid { grid-template-columns: 1fr; }
      .prod-hero { padding: 28px; }
    }
    @media(max-width:600px) {
      .screenshots-grid { grid-template-columns: 1fr; }
      .tab-bar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main id="page-main">
    <!-- rendered by JS -->
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLb()">
    <button class="lb-close" onclick="closeLb()">✕</button>
    <img id="lb-img" src="" alt="">
  </div>

  <script src="/js/data.js"></script>
  <script src="/js/shared.js"></script>
  <script>
    /* ── helpers ── */
    function badge(s) {
      if (s === 'Live') return `<span class="badge badge-live">Live</span>`;
      if (s === 'Beta') return `<span class="badge badge-beta">Beta</span>`;
      return `<span class="badge badge-dev">${s}</span>`;
    }

    function openLb(src) {
      document.getElementById('lb-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLb() { document.getElementById('lightbox').classList.remove('open'); }

    /* ── tab switching ── */
    function switchTab(id) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === id));
    }

    /* ── FAQ toggle ── */
    function toggleFaq(btn) {
      const answer = btn.nextElementSibling;
      const icon = btn.querySelector('.faq-icon');
      const open = answer.style.display === 'block';
      answer.style.display = open ? 'none' : 'block';
      icon.style.transform = open ? 'rotate(0deg)' : 'rotate(45deg)';
    }

    /* ── main render ── */
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || SOFTMACO_DATA.products[0].id;
    const p = SOFTMACO_DATA.products.find(x => x.id === id) || SOFTMACO_DATA.products[0];
    const related = SOFTMACO_DATA.products.filter(x => x.id !== p.id).slice(0, 2);

    document.getElementById('page-title').textContent = `${p.name} — Softmaco`;
    document.getElementById('page-desc').setAttribute('content', p.tagline);

    const hasPricing = p.pricing && p.pricing.length > 0;
    const hasFaq = p.faq && p.faq.length > 0;
    const hasScreenshots = p.screenshots && p.screenshots.length > 1;

    document.getElementById('page-main').innerHTML = `
    <div class="wrap" style="padding-bottom:80px;">
      <!-- breadcrumb -->
      <div class="breadcrumb reveal">
        <a href="/products.html">Products</a>
        <span class="sep">/</span>
        <span class="current">${p.name}</span>
      </div>

      <!-- Hero -->
      <div class="prod-hero reveal">
        <div class="prod-hero-grid">
          <div>
            <div class="prod-logo-lg">${p.logo}</div>
            <div class="prod-title-row">
              <h1 style="font-size:clamp(28px,4vw,44px);">${p.name}</h1>
              ${badge(p.status)}
            </div>
            <div class="prod-meta">${p.category} · Launched ${p.launchDate}</div>
            <p class="prod-tagline">${p.tagline}</p>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;flex-shrink:0;">
            <a href="${p.website}" target="_blank" rel="noopener" class="btn btn-primary btn-lg">Visit ${p.name} site ↗</a>
            <a href="/contact.html" class="btn btn-ghost btn-lg">Book a demo</a>
          </div>
        </div>
        <img src="${p.screenshots[0]}" alt="${p.name} screenshot" class="hero-screenshot"
          onerror="this.style.display='none'">
      </div>

      <!-- Tabs -->
      <div class="tab-bar reveal">
        <button class="tab-btn active" data-tab="tab-overview" onclick="switchTab('tab-overview')">Overview</button>
        <button class="tab-btn" data-tab="tab-features" onclick="switchTab('tab-features')">Features</button>
        ${hasScreenshots ? `<button class="tab-btn" data-tab="tab-screenshots" onclick="switchTab('tab-screenshots')">Screenshots</button>` : ''}
        <button class="tab-btn" data-tab="tab-tech" onclick="switchTab('tab-tech')">Tech Stack</button>
        ${hasPricing ? `<button class="tab-btn" data-tab="tab-pricing" onclick="switchTab('tab-pricing')">Pricing</button>` : ''}
        ${hasFaq ? `<button class="tab-btn" data-tab="tab-faq" onclick="switchTab('tab-faq')">FAQ</button>` : ''}
      </div>

      <!-- TAB: Overview -->
      <div class="tab-panel active" id="tab-overview">
        <div class="g2" style="margin-bottom:48px;">
          <div class="card reveal">
            <div class="eyebrow" style="margin-bottom:16px;">ABOUT</div>
            <p style="color:var(--muted);line-height:1.8;font-size:15px;">${p.fullDescription}</p>
            <div style="margin-top:24px;">
              <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--muted-2);margin-bottom:10px;">Built for</div>
              <div class="tech-row">
                ${p.targetAudience.map(t => `<span class="tech-pill" style="color:var(--azure);border-color:var(--azure-soft);">${t}</span>`).join('')}
              </div>
            </div>
          </div>
          <div class="card reveal">
            <div class="eyebrow" style="margin-bottom:16px;">PROBLEM SOLVED</div>
            <div style="background:rgba(240,76,108,.08);border-left:3px solid var(--rose);padding:14px 18px;border-radius:var(--radius-sm);margin-bottom:22px;font-size:14px;color:#fca5a5;line-height:1.6;">
              ${p.problemSolved}
            </div>
            <div class="eyebrow" style="margin-bottom:14px;">KEY BENEFITS</div>
            <ul style="display:flex;flex-direction:column;gap:11px;">
              ${p.keyBenefits.map(b => `<li style="display:flex;gap:10px;font-size:14px;"><span style="color:var(--azure);flex-shrink:0;">✓</span>${b}</li>`).join('')}
            </ul>
          </div>
        </div>

        <!-- Metrics (if live) -->
        ${p.status === 'Live' ? `
        <div class="g4 reveal" style="margin-bottom:48px;">
          <div class="card" style="text-align:center;">
            <div class="stat-num" style="justify-content:center;">2,400<span class="unit">+</span></div>
            <div class="stat-label">Active customers</div>
          </div>
          <div class="card" style="text-align:center;">
            <div class="stat-num" style="justify-content:center;">99<span class="unit">.99%</span></div>
            <div class="stat-label">Uptime SLA</div>
          </div>
          <div class="card" style="text-align:center;">
            <div class="stat-num" style="justify-content:center;">14<span class="unit"></span></div>
            <div class="stat-label">Countries</div>
          </div>
          <div class="card" style="text-align:center;">
            <div class="stat-num" style="justify-content:center;">4.8<span class="unit">★</span></div>
            <div class="stat-label">Average rating</div>
          </div>
        </div>` : ''}

        <!-- Related -->
        <h2 class="reveal" style="font-size:clamp(20px,2.5vw,28px);margin-bottom:22px;">Other products</h2>
        <div class="g2">
          ${related.map(r => `
          <div class="card reveal related-card">
            <div>
              <div style="font-size:2rem;margin-bottom:8px;">${r.logo}</div>
              <h3 style="font-size:17px;margin-bottom:6px;">${r.name}</h3>
              <p style="font-size:13px;color:var(--muted);">${r.tagline}</p>
            </div>
            <a href="/product.html?id=${r.id}" class="btn btn-ghost btn-sm" style="flex-shrink:0;">View →</a>
          </div>`).join('')}
        </div>
      </div>

      <!-- TAB: Features -->
      <div class="tab-panel" id="tab-features">
        <div class="g3">
          ${p.features.map(f => `
          <div class="card reveal">
            <div class="feat-icon">${f.icon}</div>
            <h3 style="font-size:16px;margin-bottom:10px;">${f.title}</h3>
            <p style="font-size:14px;color:var(--muted);">${f.description}</p>
          </div>`).join('')}
        </div>
      </div>

      <!-- TAB: Screenshots -->
      ${hasScreenshots ? `
      <div class="tab-panel" id="tab-screenshots">
        <div class="screenshots-grid">
          ${p.screenshots.map((s, i) => `
          <div class="screenshot-item reveal" onclick="openLb('${s}')">
            <img src="${s}" alt="Screenshot ${i+1}" onerror="this.parentElement.style.display='none'">
            <div style="padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted-2);">Click to expand</div>
          </div>`).join('')}
        </div>
      </div>` : ''}

      <!-- TAB: Tech Stack -->
      <div class="tab-panel" id="tab-tech">
        <div class="card tech-section reveal">
          <div class="eyebrow" style="margin-bottom:28px;">FULL TECHNOLOGY STACK</div>
          <div class="g3" style="gap:32px;">
            <div>
              <div class="tech-col-label" style="color:var(--azure);">Frontend</div>
              <div class="tech-row">${p.techStack.frontend.map(t => `<span class="tech-pill">${t}</span>`).join('')}</div>
            </div>
            <div>
              <div class="tech-col-label" style="color:var(--brass);">Backend</div>
              <div class="tech-row">${p.techStack.backend.map(t => `<span class="tech-pill">${t}</span>`).join('')}</div>
            </div>
            <div>
              <div class="tech-col-label" style="color:var(--emerald);">Database</div>
              <div class="tech-row">${p.techStack.database.map(t => `<span class="tech-pill">${t}</span>`).join('')}</div>
            </div>
            <div>
              <div class="tech-col-label" style="color:var(--muted);">Cloud</div>
              <div class="tech-row">${p.techStack.cloud.map(t => `<span class="tech-pill">${t}</span>`).join('')}</div>
            </div>
            ${p.techStack.aiModels && p.techStack.aiModels.length ? `
            <div>
              <div class="tech-col-label" style="color:var(--rose);">AI Models</div>
              <div class="tech-row">${p.techStack.aiModels.map(t => `<span class="tech-pill">${t}</span>`).join('')}</div>
            </div>` : ''}
          </div>
        </div>
      </div>

      <!-- TAB: Pricing -->
      ${hasPricing ? `
      <div class="tab-panel" id="tab-pricing">
        <div class="price-grid">
          ${p.pricing.map(tier => `
          <div class="card price-card ${tier.popular ? 'popular' : ''} reveal">
            ${tier.popular ? `<div class="popular-label">Most Popular</div>` : ''}
            <div class="price-tier">${tier.tier}</div>
            <div class="price-amount">${tier.price}</div>
            <div class="price-period">${tier.period || ''}</div>
            <ul class="price-feat-list">
              ${tier.features.map(f => `<li><span class="tick">✓</span>${f}</li>`).join('')}
            </ul>
            <a href="/contact.html" class="btn ${tier.popular ? 'btn-azure' : 'btn-ghost'}" style="width:100%;justify-content:center;">
              Get started
            </a>
          </div>`).join('')}
        </div>
        <p class="reveal" style="text-align:center;margin-top:24px;font-size:13.5px;color:var(--muted-2);">
          All plans include a 21-day free trial · No credit card required
        </p>
      </div>` : ''}

      <!-- TAB: FAQ -->
      ${hasFaq ? `
      <div class="tab-panel" id="tab-faq">
        <div style="max-width:720px;">
          ${p.faq.map(f => `
          <div class="faq-item reveal">
            <button class="faq-btn" onclick="toggleFaq(this)">
              <span class="faq-question">${f.question}</span>
              <span class="faq-icon">+</span>
            </button>
            <div class="faq-answer">${f.answer}</div>
          </div>`).join('')}
        </div>
      </div>` : ''}

      <!-- Final CTA -->
      <div class="cta-box reveal" style="margin-top:80px;">
        <div class="eyebrow center" style="margin-bottom:18px;">READY TO TRANSFORM?</div>
        <h2>Put ${p.name} to work for your business.</h2>
        <p>Visit the official site for a full demo, or speak directly with our team about enterprise licensing.</p>
        <div class="cta-actions">
          <a href="${p.website}" target="_blank" rel="noopener" class="btn btn-primary btn-lg">Visit ${p.name} ↗</a>
          <a href="/contact.html" class="btn btn-ghost btn-lg">Talk to us</a>
        </div>
      </div>
    </div>`;
  </script>
</body>
</html>
